server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must never be cached. It is the only file that names the content-hashed bundles,
  # so a stale copy pins the browser to a previous deploy's JS — and that JS is served `immutable`
  # below, meaning it is never re-requested either. The result is a browser that keeps rendering
  # an old build with no network request and no visible error.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
  }

  # Safe to cache hard: Vite puts a content hash in every one of these filenames, so a changed
  # file is a different URL.
  location ~* \.(js|css|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
